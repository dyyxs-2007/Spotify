name: Spotify
options:
  bundleIdPrefix: com.dyyxs
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Spotify:
    type: application
    platform: iOS
    sources:
      - path: Spotify
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyyxs.Spotify
        PRODUCT_NAME: Spotify
        INFOPLIST_FILE: Spotify/Resources/Info.plist
        GCC_PREFIX_HEADER: Spotify/App/PrefixHeader.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        TARGETED_DEVICE_FAMILY: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
